name: CI/CD Pipeline - Deploy to GitHub Pages & Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'production-deployments'
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build & Deploy to GitHub Pages
  # ─────────────────────────────────────────────────────────────
  deploy-github-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: 'dashboard/yarn.lock'

      - name: Install Dependencies
        working-directory: dashboard
        run: yarn install --frozen-lockfile

      - name: Build Static PWA Sites for GitHub Pages
        working-directory: dashboard
        run: node build-gh-pages.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard/out-pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build & Deploy to Vercel (via GitHub Actions)
  # ─────────────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: 'dashboard/yarn.lock'

      - name: Install Dependencies
        working-directory: dashboard
        run: yarn install --frozen-lockfile

      - name: Build Static PWA Bundle for Vercel
        working-directory: dashboard
        run: node build-vercel.js

      - name: Deploy to Vercel Production
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Trigger Vercel Deploy Hook (Alternative)
        if: env.VERCEL_DEPLOY_HOOK != '' && env.VERCEL_TOKEN == ''
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
